p{font-size:clamp(15px,2.9vw,17px);color:#C9D3DC;margin-bottom:14px}

.contact{display:flex;flex-direction:column;gap:12px;align-items:center}

  border-bottom:1px solid rgba(232,180,92,.32);padding-bottom:3px;
  transition:color .46s cubic-bezier(.22,.61,.36,1),border-color .46s cubic-bezier(.22,.61,.36,1)}
a:hover{color:#F3CE8B;border-color:#F3CE8B}
.en{font-family:'Jakarta',sans-serif;direction:ltr;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:#8A98A5;margin-top:34px}
