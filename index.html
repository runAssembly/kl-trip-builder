:root{
  --cream:#FAF6F0;
  --surface:#FFFFFF;
  --ink:#1C1A17;
  --muted:#6E6862;
  --faint:#9B948C;
  --line:#E7DFD4;
  --amber:#D4761B;        /* pulled from the sun in their mark */
  --amber-soft:#FBEEDE;
  --amber-line:#F0D6B4;
  --deep:#15463A;
  --green:#5FA83C;
  --blue:#1E8BC3;
  --red:#C0392B;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ui:'Jakarta',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Display',Georgia,serif;
}
/* Arabic gets its own pair — Instrument Serif and Jakarta have no Arabic coverage at all, so
   without this the whole page falls back to whatever the device happens to have. */
html[lang="ar"]{--ui:'PlexArabic','Jakarta',sans-serif;--display:'NaskhArabic','PlexArabic',serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
html[lang="ar"] body{line-height:1.72}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mny{direction:ltr;unicode-bidi:isolate;display:inline-block}
[hidden]{display:none !important}

/* ---------- header ---------- */
header{padding:16px 0;position:sticky;top:0;z-index:30;background:rgba(250,246,240,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;
  font-family:var(--ui);color:inherit;text-align:start}
.mark img{height:46px;width:auto;display:block;flex:none}
.mark b{display:block;font-weight:700;font-size:15.5px;line-height:1.25}
.mark span{display:block;font-size:11.5px;color:var(--faint)}
.right{display:flex;align-items:center;gap:8px}
.navlink{background:none;border:0;font-family:var(--ui);font-size:14px;font-weight:500;color:var(--muted);
  cursor:pointer;padding:7px 11px;border-radius:9px;transition:background-color .46s var(--ease),color .46s var(--ease)}
.navlink:hover{color:var(--ink);background:#F1EAE0}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface);flex:none;margin-inline-start:6px}
.lang button{padding:6px 12px;border:0;background:transparent;cursor:pointer;font-family:var(--ui);
  font-size:12.5px;font-weight:600;color:var(--muted);transition:background-color .46s var(--ease),color .46s var(--ease)}
.lang button:hover{color:var(--ink)}
.lang button:active{transform:scale(.97)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
@media(max-width:820px){.navlink{display:none}.mark .txt span{display:none}}
@media(max-width:420px){.mark .txt{display:none}}

/* ---------- landing ---------- */
.lhero{position:relative;min-height:76vh;display:flex;align-items:flex-end;overflow:hidden;
  border-radius:0 0 34px 34px;margin-bottom:8px}
.lhero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lhero .scrim{position:absolute;inset:0;
  background:linear-gradient(to left,rgba(10,24,20,.90),rgba(10,24,20,.72) 45%,rgba(10,24,20,.38))}
.lhero .in{position:relative;padding:0 24px 72px;max-width:1180px;margin:0 auto;width:100%;color:#F6F1E8}
.lhero h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,5.4vw,62px);line-height:1.28;max-width:15ch}
.lhero p{margin-top:18px;font-size:clamp(16px,2vw,20px);opacity:.9;max-width:56ch;line-height:1.7}
.lhero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:2px;background:var(--line);
  border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:34px 0 0}
.trust div{background:var(--surface);padding:20px 22px;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.trust b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:3px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.svc .s{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;cursor:pointer;text-align:start;font-family:var(--ui);color:inherit;
  transition:border-color .46s var(--ease)}
.svc .s:hover{border-color:#D8CCB9}
.svc .s:active{transform:scale(.995)}
.svc .s img{width:100%;height:150px;object-fit:cover;display:block}
.svc .s .t{padding:20px 22px 24px}
.svc .s b{display:block;font-size:17px;font-weight:600;margin-bottom:6px}
.svc .s span{font-size:14px;color:var(--muted);line-height:1.6}
.dest{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.dest .d{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;display:block}
.dest .d img{width:100%;height:100%;object-fit:cover;display:block}
.dest .d .lab{position:absolute;inset:auto 0 0 0;padding:44px 20px 18px;color:#fff;
  background:linear-gradient(to top,rgba(10,24,20,.86),rgba(10,24,20,0))}
.dest .d .lab b{display:block;font-size:18px;font-weight:600}
.dest .d .lab span{font-size:13px;opacity:.85}
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}
@media(max-width:820px){.about{grid-template-columns:1fr}}
.about .ph{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.about .ph img{width:100%;border-radius:14px;display:block;aspect-ratio:3/4;object-fit:cover}
.about p{font-size:16.5px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.about .em{font-size:15px}
.about .em a{color:var(--amber)}

/* ---------- inquiry fields ---------- */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.fields{grid-template-columns:1fr}}
.field{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 16px}
.field label{display:block;font-size:12.5px;color:var(--faint);margin-bottom:4px}
.field input{width:100%;border:0;background:transparent;font-family:var(--ui);font-size:15px;
  color:var(--ink);outline:none}
.field input::placeholder{color:#C6BFB5}

/* ---------- hero ---------- */
.hero{padding:52px 0 30px;max-width:740px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,5.4vw,56px);line-height:1.05;letter-spacing:-.015em}
html[lang="ar"] .hero h1{font-size:clamp(29px,4.6vw,47px);line-height:1.35;letter-spacing:0;font-weight:600}
.hero h1 em{font-style:italic;color:var(--amber)}
html[lang="ar"] .hero h1 em{font-style:normal}
.hero p{margin-top:16px;font-size:17px;color:var(--muted);max-width:580px}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;padding:24px 0 4px;border-top:1px solid var(--line);margin-top:32px}
.facts div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.facts svg{flex:none}

/* ---------- sections ---------- */
section.blk{padding:46px 0;scroll-margin-top:84px}
section.blk+section.blk{border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.sh h2{font-size:23px;font-weight:600;letter-spacing:-.015em}
.sh .sub{font-size:13.5px;color:var(--faint);margin-inline-start:auto;text-align:end}

/* ---------- toggle ---------- */
.seg{display:inline-flex;background:#F1EAE0;border-radius:999px;padding:4px;gap:2px;margin-bottom:22px}
.seg button{border:0;background:transparent;font-family:var(--ui);font-size:14px;font-weight:600;color:var(--muted);
  padding:9px 18px;border-radius:999px;cursor:pointer;transition:background-color .46s var(--ease),color .46s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

/* ---------- package cards ---------- */
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.pkg{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:22px;cursor:pointer;text-align:start;font-family:var(--ui);color:inherit;
  transition:border-color .46s var(--ease)}
.pkg:hover{border-color:#D8CCB9}
.pkg:active{transform:scale(.995)}
.pkg .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:#F1EAE0;color:var(--muted)}
.pill.fly{background:var(--amber-soft);color:#A0570F}
.pkg h3{font-size:17.5px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.pkg .en{font-size:12.5px;color:var(--faint);margin-top:3px;direction:ltr;text-align:start}
html[dir="rtl"] .pkg .en{text-align:right}
.pkg .foot{margin-top:auto;padding-top:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pkg .from{font-size:12px;color:var(--faint);display:block;margin-bottom:2px}
.pkg .amt{font-family:var(--display);font-size:29px;line-height:1;direction:ltr;display:inline-block}
html[lang="ar"] .pkg .amt{font-weight:600}
.pkg .go{width:34px;height:34px;border-radius:50%;background:#F1EAE0;display:grid;place-items:center;flex:none;
  transition:background-color .46s var(--ease)}
.pkg:hover .go{background:var(--amber);color:#fff}
html[dir="rtl"] .pkg .go svg{transform:scaleX(-1)}

/* ---------- rate tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:#FCFAF7}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;direction:ltr;text-align:end;font-weight:600}
html[dir="rtl"] td.n{text-align:left}
td.name{white-space:normal;min-width:260px;font-weight:500}
td.name small{display:block;color:var(--faint);font-size:12px;font-weight:400;direction:ltr}
html[dir="rtl"] td.name small{text-align:right}
.na{color:var(--faint);font-weight:400}

/* ---------- visa + flight cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:17px;font-weight:600;margin-bottom:4px}
.card .meta{font-size:13px;color:var(--faint);margin-bottom:14px}
.card .rows{display:grid;gap:8px;margin-bottom:14px}
.card .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;align-items:baseline}
.card .row b{font-family:var(--display);font-size:20px;direction:ltr}
html[lang="ar"] .card .row b{font-weight:600}
.card details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.card summary{font-size:13px;color:var(--muted);cursor:pointer;list-style:none}
.card summary::-webkit-details-marker{display:none}
.card summary:hover{color:var(--ink)}
.card ul{list-style:none;margin-top:9px;display:grid;gap:5px}
.card li{font-size:12.5px;color:var(--muted);padding-inline-start:14px;position:relative;line-height:1.5}
.card li::before{content:'';position:absolute;inset-inline-start:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--amber-line)}

.dates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.dt{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--surface);font-size:13.5px}
.dt b{display:block;font-variant-numeric:tabular-nums;direction:ltr;font-weight:600;margin-bottom:3px}
html[dir="rtl"] .dt b{text-align:right}
.dt span{font-size:12.5px}
.dt.ok span{color:#3D7A22}
.dt.few span{color:#A0570F}
.dt.out{opacity:.55}
.dt.out span{color:var(--red)}

/* ---------- contact band ---------- */
.band{background:var(--deep);color:#F3EFE7;border-radius:18px;padding:30px 32px;display:flex;
  align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
.band b{display:block;font-size:20px;font-weight:600;margin-bottom:5px}
.band span{font-size:14.5px;opacity:.82}
.band a{color:#F3EFE7}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 18px;border-radius:11px;
  border:1px solid transparent;cursor:pointer;font-family:var(--ui);font-weight:600;font-size:14.5px;
  text-decoration:none;color:var(--ink);width:100%;
  transition:background-color .46s var(--ease),color .46s var(--ease),border-color .46s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--amber);color:#fff}
.btn.p:hover{background:#B4600F}
.btn.s{background:var(--surface);border-color:var(--line)}
.btn.s:hover{background:var(--cream);border-color:#D8CCB9}
.btn.inline{width:auto;display:inline-flex}

/* ---------- quote view ---------- */
.back{background:none;border:0;font-family:var(--ui);font-size:14px;color:var(--muted);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;padding:4px 0;margin:26px 0 0;transition:color .46s var(--ease)}
.back:hover{color:var(--ink)}
html[dir="rtl"] .back svg{transform:scaleX(-1)}
.qhead{padding:14px 0 26px;max-width:720px}
.qhead h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.2vw,42px);line-height:1.12;letter-spacing:-.015em}
html[lang="ar"] .qhead h1{font-weight:600;line-height:1.32;font-size:clamp(25px,3.7vw,37px)}
.qhead .en{font-size:14px;color:var(--faint);margin-top:6px;direction:ltr}
html[dir="rtl"] .qhead .en{text-align:right}
.qhead .top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.cols{display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start;padding-bottom:64px}
/* The aside has to span the full row, not just its own content — a sticky child can only travel
   as far as its parent's box, so a content-height aside lets the quote scroll away halfway down. */
.cols>aside{align-self:stretch}
@media(max-width:940px){.cols{grid-template-columns:1fr;gap:0;padding-bottom:0}}

.qsec{margin-bottom:38px}
.step{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.step .n{font-family:var(--display);font-size:15px;color:var(--amber);width:22px;flex:none}
.step h2{font-size:17px;font-weight:600}
.step .hint{font-size:13px;color:var(--faint);margin-inline-start:auto;text-align:end}

.paxrows{display:grid;gap:10px}
.paxrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px}
.paxrow .lb b{display:block;font-size:15px;font-weight:600}
.paxrow .lb span{font-size:13px;color:var(--muted)}
.paxrow .rt{display:flex;align-items:center;gap:16px}
.paxrow .each{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.ctrl{display:flex;align-items:center;gap:4px}
.ctrl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);cursor:pointer;display:grid;place-items:center;
  transition:background-color .46s var(--ease),border-color .46s var(--ease),color .46s var(--ease)}
.ctrl button:hover:not(:disabled){background:var(--amber-soft);border-color:var(--amber)}
.ctrl button:active:not(:disabled){transform:scale(.97)}
.ctrl button:disabled{color:#D8D2C8;cursor:not-allowed}
.ctrl .val{font-family:var(--display);font-size:25px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
html[lang="ar"] .ctrl .val{font-weight:600}

.veh{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.vchip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-family:var(--ui);font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;
  transition:background-color .46s var(--ease),border-color .46s var(--ease),color .46s var(--ease)}
.vchip:hover{border-color:#D8CCB9;color:var(--ink)}
.vchip:active{transform:scale(.97)}
.vchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.vchip:disabled{opacity:.4;cursor:not-allowed}

.picks{display:grid;gap:9px}
.pick{display:flex;align-items:center;gap:13px;width:100%;text-align:start;font-family:var(--ui);color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 16px;cursor:pointer;
  transition:border-color .46s var(--ease),background-color .46s var(--ease)}
.pick:hover{border-color:#D8CCB9}
.pick:active{transform:scale(.995)}
.pick[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-soft)}
.pick .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;
  transition:background-color .46s var(--ease),border-color .46s var(--ease)}
.pick[aria-pressed="true"] .bx{background:var(--amber);border-color:var(--amber)}
.pick .bx svg{opacity:0;transition:opacity .46s var(--ease)}
.pick[aria-pressed="true"] .bx svg{opacity:1}
.pick .tx{flex:1;min-width:0}
.pick .tx b{display:block;font-size:14.5px;font-weight:600;line-height:1.4}
.pick .tx span{font-size:12.5px;color:var(--muted)}
.pick .amt{font-size:14px;font-weight:600;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.pick .amt.na{color:var(--faint);font-weight:500;font-size:12.5px;white-space:normal;text-align:end;max-width:110px}
.pick:disabled{cursor:not-allowed}
.pick:disabled:hover{border-color:var(--line)}

.note{background:#FCFAF7;border:1px solid var(--line);border-radius:14px;padding:16px 18px;font-size:13.5px;
  color:var(--muted);line-height:1.65;white-space:pre-line;margin-top:14px}

.sum{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sum h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:20px 22px 0;font-weight:600}
html[lang="ar"] .sum h3{letter-spacing:0;text-transform:none;font-size:13px}
.lines{padding:12px 22px 16px;max-height:46vh;overflow-y:auto}
.line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;font-size:14px;align-items:baseline}
.line+.line{border-top:1px solid var(--line)}
.line .d{color:var(--muted);min-width:0}
.line .d b{color:var(--ink);font-weight:600;display:block;font-size:14.5px;line-height:1.4}
.line .v{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.empty{padding:6px 0 10px;font-size:13.5px;color:var(--faint)}
.total{background:var(--deep);color:#F3EFE7;padding:20px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.72;font-weight:600}
html[lang="ar"] .total .l{letter-spacing:0;text-transform:none;font-size:13px}
.total .l span{display:block;text-transform:none;letter-spacing:0;font-size:13px;opacity:.85;margin-top:5px;font-weight:400}
.total .v{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr}
html[lang="ar"] .total .v{font-weight:600}
.acts{padding:16px 22px 22px;display:grid;gap:9px}
.fine{padding:0 22px 22px;font-size:12.5px;color:var(--faint);line-height:1.6}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);padding:28px 0 44px;font-size:13px;color:var(--faint)}
footer .fl{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between}

/* ---------- floating WhatsApp ---------- */
.wafab{position:fixed;inset-inline-end:24px;bottom:24px;z-index:35;display:inline-flex;align-items:center;gap:10px;
  background:#1E9E56;color:#fff;text-decoration:none;padding:14px 20px;border-radius:999px;font-weight:600;
  font-size:15px;font-family:var(--ui);box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:background-color .46s var(--ease)}
.wafab:hover{background:#17building}
.wafab:hover{background:#178A4A}
.wafab:active{transform:scale(.97)}
@media(max-width:940px){body.quoting .wafab{bottom:calc(88px + env(safe-area-inset-bottom))}
  .wafab span{display:none}.wafab{padding:15px}}

/* ---------- mobile running total ---------- */
.mbar{display:none}
@media(max-width:940px){
  .sum{position:static;margin:0 0 30px}
  body.quoting{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
  body.quoting .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;gap:14px;
    background:var(--deep);color:#F3EFE7;padding:12px 18px calc(12px + env(safe-area-inset-bottom))}
  .mbar .l{flex:1;min-width:0}
  .mbar .l span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.7;font-weight:600}
  html[lang="ar"] .mbar .l span{letter-spacing:0;text-transform:none;font-size:12px}
  .mbar .l b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.15;direction:ltr;display:block}
  html[lang="ar"] .mbar .l b{font-weight:600}
  .mbar a{background:var(--amber);color:#fff;text-decoration:none;font-weight:600;font-size:14.5px;padding:12px 18px;
    border-radius:11px;white-space:nowrap;transition:background-color .46s var(--ease)}
  .mbar a:hover{background:#B4600F}
  .mbar a:active{transform:scale(.97)}
}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CHECK='<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l2.6 2.6L9 1.2" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function pkgById(id){return DATA.packages.find(p=>p.id===id)}
function paxTotal(){return Object.values(S.pax).reduce((a,b)=>a+b,0)}
// The tour tables are per region; a package that spans two of them should offer both sets.
function regionsFor(p){
  if(!p)return [];
  const n=(p.en+' '+p.ar).toLowerCase();
  return DATA.regions.filter(r=>{
    const key=r.en.split('-')[0].trim().toLowerCase();
    return key && n.includes(key.toLowerCase());
  });
}
function vehiclesFor(p){
  const set=[];
  regionsFor(p).forEach(r=>r.vehicles.forEach(v=>{if(!set.includes(v))set.push(v)}));
  return set;
}
const CAP={sedan:3,minivan:8,van:14,vip:6,bus:40};
function autoVehicle(p){
  // Seat the group in the smallest vehicle that actually fits — an agent quoting for six should
  // not be shown a sedan price they cannot use.
  const avail=vehiclesFor(p), n=Math.max(1,paxTotal());
  const fits=avail.filter(v=>CAP[v]>=n).sort((a,b)=>CAP[a]-CAP[b]);
  return fits[0]||avail.sort((a,b)=>CAP[b]-CAP[a])[0]||null;
}

  $('h1').innerHTML=x.h1; $('sub').textContent=x.sub;
  $('facts').innerHTML=x.facts.map(f=>`<div>${TICK}${esc(f)}</div>`).join('');
  $('pkg-h').textContent=x.pkgH; $('pkg-sub').textContent=x.pkgSub;
  $('tour-h').textContent=x.tourH; $('tour-sub').textContent=x.tourSub;
  $('visa-h').textContent=x.visaH; $('visa-sub').textContent=x.visaSub;
  $('fl-h').textContent=x.flH; $('fl-sub').textContent=x.flSub;
  $('band-b').textContent=x.bandB; $('band-s').textContent=x.bandS; $('band-btn').textContent=x.bandBtn;

  $('fseg').innerHTML=`
    <button type="button" data-flt="1" aria-pressed="${S.flightFilter}">${x.segF}</button>
    <button type="button" data-flt="0" aria-pressed="${!S.flightFilter}">${x.segN}</button>`;

  const list=DATA.packages.filter(p=>p.flight===S.flightFilter);
  $('pkgs').innerHTML=list.map(p=>{
    const from=p.prices.dblTriple;
    return `<button class="pkg" type="button" data-pkg="${p.id}">
      <div class="top">
        <span class="pill">${x.nights(p.nights)} · ${x.days(p.days)}</span>
        <span class="pill ${p.flight?'fly':''}">${p.flight?x.withFlight:x.noFlight}</span>
      </div>
      <h3>${esc(L(p))}</h3>
      <div class="en">${esc(p.en)}</div>
      <div class="foot">
        <div><span class="from">${x.from} · ${x.perPerson}</span><span class="amt">${usd(from)}</span></div>
        <span class="go">${ARROW}</span>
      </div>
    </button>`}).join('');

  $('tourtables').innerHTML=DATA.regions.map(r=>{
    const cols=r.vehicles;
    return `<div style="margin-bottom:26px">
      <div style="font-weight:600;font-size:16px;margin-bottom:10px">${esc(L(r))}</div>
      <div class="tw"><table>
        <thead><tr><th>${esc(x.tourH)}</th>${cols.map(c=>`<th>${x.vehicles[c]||c}</th>`).join('')}</tr></thead>
        <tbody>${r.tours.map(tr=>`<tr>
          <td class="name">${esc(L(tr))}<small>${esc(tr.en)}</small></td>
          ${cols.map(c=>`<td class="n">${tr.prices[c]!=null?usd(tr.prices[c]):`<span class="na">${x.onRequest}</span>`}</td>`).join('')}
        </tr>`).join('')}</tbody>
      </table></div></div>`}).join('');

  $('visas').innerHTML=DATA.visas.map(v=>`
    <div class="card">
      <h3>${esc(L(v))}</h3>
      <div class="meta">${esc(v.validity||'')}</div>
      ${v.eligible?`<div class="meta" style="margin-top:-8px">${esc(v.eligible)}</div>`:''}
      <div class="rows">${
        v.options.length
          ? v.options.map(o=>`<div class="row"><span>${esc(o.duration)}</span><b>${usd(o.price)}</b></div>`).join('')
          : `<div class="row"><span class="na">${x.onRequest}</span></div>`}</div>
      ${v.requirements.length?`<details><summary>${x.requirements}</summary><ul>${
        v.requirements.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>`:''}
    </div>`).join('');

  const f=DATA.flights;
  const st=s=>/نفاذ|نفدت/.test(s)?['out',x.soldout]:/مقعد/.test(s)?['few',s]:['ok',x.available];
  $('flights').innerHTML=`
    <div class="cards" style="margin-bottom:24px">
      <div class="card"><h3>${x.adult}</h3><div class="rows"><div class="row"><span>${esc(x.flSub)}</span><b>${usd(f.adult)}</b></div></div></div>
      <div class="card"><h3>${x.child}</h3><div class="rows"><div class="row"><span>${esc(x.flSub)}</span><b>${usd(f.child)}</b></div></div></div>
      <div class="card"><h3>${x.infant}</h3><div class="rows"><div class="row"><span>${esc(x.flSub)}</span><b>${usd(f.infant)}</b></div></div></div>
    </div>
    <div style="font-weight:600;margin:0 0 10px">${x.outbound}</div>
    <div class="dates" style="margin-bottom:20px">${f.out.map(d=>{const[c,l]=st(d.status);
      return `<div class="dt ${c}"><b>${d.date}</b><span>${esc(l)}</span></div>`}).join('')}</div>
    <div style="font-weight:600;margin:0 0 10px">${x.inbound}</div>
    <div class="dates">${f.back.map(d=>{const[c,l]=st(d.status);
      return `<div class="dt ${c}"><b>${d.date}</b><span>${esc(l)}</span></div>`}).join('')}</div>
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <a class="btn s inline" href="mailto:${EMAIL}">${x.askSeats}</a>
      <span style="font-size:13px;color:var(--faint)">${x.seatsNote}</span>
    </div>`;
}

/* ============================ QUOTE ============================ */
function drawQuote(){
  const x=t(),p=pkgById(S.pkg);
  $('back-t').textContent=x.back;
  $('q-pills').innerHTML=`
    <span class="pill">${x.nights(p.nights)} · ${x.days(p.days)}</span>
    <span class="pill ${p.flight?'fly':''}">${p.flight?x.withFlight:x.noFlight}</span>`;
  $('q-h1').textContent=L(p);
  $('q-en').textContent=p.en;
  $('s1').textContent=x.s1; $('s1h').textContent=x.s1h;
  $('s2').textContent=x.s2; $('s2h').textContent=x.s2h;
  $('s3').textContent=x.s3; $('s3h').textContent=x.s3h;
  $('sum-t').textContent=x.sum;

  $('pax').innerHTML=Object.keys(S.pax).map(k=>{
    const price=p.prices[k], [lb,sb]=x.pax[k];
    return `<div class="paxrow">
      <div class="lb"><b>${lb}</b><span>${sb||''}</span></div>
      <div class="rt">
        <span class="each">${price==null?'—':(price===0?'0':usd(price))}</span>
        <div class="ctrl">
          <button type="button" data-pdec="${k}" aria-label="-"><svg width="13" height="2" viewBox="0 0 13 2"><rect width="13" height="2" rx="1" fill="currentColor"/></svg></button>
          <div class="val" id="pv-${k}">${S.pax[k]}</div>
          <button type="button" data-pinc="${k}" aria-label="+"><svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 0v13M0 6.5h13" stroke="currentColor" stroke-width="2"/></svg></button>
        </div>
      </div>
    </div>`}).join('');

  if(p.notes){$('p-note').hidden=false;$('p-note').textContent=p.notes}else{$('p-note').hidden=true}

  const regs=regionsFor(p), avail=vehiclesFor(p);
  $('sec-tours').hidden=!regs.length;
  if(regs.length){
    if(!S.vehicle||!avail.includes(S.vehicle))S.vehicle=autoVehicle(p);
    $('veh').innerHTML=`<span style="align-self:center;font-size:13px;color:var(--faint);margin-inline-end:4px">${x.vehicle}</span>`+
      avail.map(v=>`<button type="button" class="vchip" data-veh="${v}" aria-pressed="${S.vehicle===v}">${x.vehicles[v]||v}</button>`).join('');
    $('tours').innerHTML=regs.map(r=>r.tours.map((tr,i)=>{
      const key=r.en+'|'+i, price=tr.prices[S.vehicle];
      const on=!!S.tours[key], has=price!=null;
      return `<button type="button" class="pick" data-tour="${esc(key)}" aria-pressed="${on}" ${has?'':'disabled'}>
        <span class="bx">${CHECK}</span>
        <span class="tx"><b>${esc(L(tr))}</b><span>${esc(L(r))}</span></span>
        <span class="amt ${has?'':'na'}">${has?usd(price):x.onRequest}</span>
      </button>`}).join('')).join('');
  }

  $('visapicks').innerHTML=DATA.visas.map((v,i)=>{
    const o=v.options[0], has=!!o, n=S.visas[i]||0;
    return `<button type="button" class="pick" data-visa="${i}" aria-pressed="${n>0}" ${has?'':'disabled'}>
      <span class="bx">${CHECK}</span>
      <span class="tx"><b>${esc(L(v))}</b><span>${has?esc(o.duration):''}</span></span>
      <span class="amt ${has?'':'na'}">${has?usd(o.price):x.onRequest}</span>
    </button>`}).join('');
}

function quote(){
  const p=pkgById(S.pkg),x=t(),lines=[];let total=0;
  Object.keys(S.pax).forEach(k=>{
    const n=S.pax[k],price=p.prices[k];
    if(!n||price==null)return;
    const v=price*n;total+=v;
    lines.push({b:x.pax[k][0],d:`${n} × ${M(price)}`,v});
  });
  regionsFor(p).forEach(r=>r.tours.forEach((tr,i)=>{
    const key=r.en+'|'+i;
    if(!S.tours[key])return;
    const price=tr.prices[S.vehicle];
    if(price==null)return;
    total+=price;
    lines.push({b:L(tr),d:`${x.vehicles[S.vehicle]||S.vehicle}`,v:price});
  }));
  DATA.visas.forEach((v,i)=>{
    const n=S.visas[i]||0,o=v.options[0];
    if(!n||!o)return;
    const val=o.price*n;total+=val;
    lines.push({b:L(v),d:`${n} × ${M(o.price)}`,v:val});
  });
  return {total,lines,p};
}

function render(){
  const x=t(),q=quote();
  Object.keys(S.pax).forEach(k=>{const el=$('pv-'+k);if(el)el.textContent=S.pax[k]});
  document.querySelectorAll('[data-pdec]').forEach(b=>b.disabled=S.pax[b.dataset.pdec]<=0);
  document.querySelectorAll('[data-veh]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.veh===S.vehicle));
  document.querySelectorAll('[data-tour]').forEach(b=>b.setAttribute('aria-pressed',!!S.tours[b.dataset.tour]));
  document.querySelectorAll('[data-visa]').forEach(b=>b.setAttribute('aria-pressed',(S.visas[b.dataset.visa]||0)>0));

  $('lines').innerHTML=q.lines.length
    ? q.lines.map(l=>`<div class="line"><div class="d"><b>${l.b}</b>${l.d}</div><div class="v">${M(l.v)}</div></div>`).join('')
    : `<div class="empty">${x.empty}</div>`;
  $('t-sub').textContent=x.travellers(paxTotal());
  $('t-val').textContent=usd(q.total);
  $('m-val').textContent=usd(q.total);

  const who=['f-agency','f-person','f-phone','f-date'].map(id=>($(id)||{}).value||'').map(v=>v.trim());
  const whoLine=who.some(Boolean)
    ? '\n'+[[x.land.agency,who[0]],[x.land.person,who[1]],[x.land.phone,who[2]],[x.land.date,who[3]]]
        .filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n')+'\n'
    : '';
  const head=`${x.quoteFor}: ${L(q.p)}`;
  const body=q.lines.map(l=>`• ${l.b.replace(/<[^>]+>/g,'')}: ${money(l.v)}`).join('\n');
  const txt=`${head}\n${x.nights(q.p.nights)} · ${q.p.flight?x.withFlight:x.noFlight}\n${x.travellers(paxTotal())}\n${whoLine}\n${body}\n\n${x.total}: ${money(q.total)}`;
  // Send straight to the operator's line — a quote that lands nowhere is not an enquiry.
  const wa=waLink(txt);
  $('wa').href=wa;$('m-wa').href=wa;$('cp').dataset.txt=txt;
}

/* ============================ CHROME + ROUTING ============================ */
function chrome(){
  const x=t();
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  $('wordmark').textContent=x.wordmark; $('tagline').textContent=x.tagline;
  document.querySelectorAll('[data-jump]').forEach((b,i)=>b.textContent=x.nav[i]);
  $('t-lbl').textContent=x.total; $('m-lbl').textContent=x.total;
  $('wa-t').textContent=x.wa; $('m-wa-t').textContent=x.wa;
  $('cp').textContent=x.copy; $('fine').textContent=x.fine;
  $('lb-agency').textContent=x.land.agency; $('f-agency').placeholder=x.land.agencyP;
  $('lb-person').textContent=x.land.person; $('f-person').placeholder=x.land.personP;
  $('lb-phone').textContent=x.land.phone;   $('f-phone').placeholder=x.land.phoneP;
  $('lb-date').textContent=x.land.date;     $('f-date').placeholder=x.land.dateP;
  $('s4').textContent=x.land.s4; $('s4h').textContent=x.land.s4h;
  $('wafab-t').textContent=x.waFab;
  $('wafab').href=waLink('');
  $('f1').textContent=x.f1; $('f2').textContent=x.f2;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
}
function redraw(){
  chrome();
  const q=S.view==='quote'&&pkgById(S.pkg);
  if(!q&&S.view==='quote')S.view='land';
  $('view-land').hidden=S.view!=='land';
  $('view-home').hidden=S.view!=='home';
  $('view-quote').hidden=S.view!=='quote';
  document.body.classList.toggle('quoting',S.view==='quote');
  if(S.view==='land')drawLand();
  else if(S.view==='home')drawHome();
  else{drawQuote();render()}
}
function go(view,id,section){
  S.view=view;S.pkg=id||null;
  if(view==='quote'){S.tours={};S.visas={};S.vehicle=null;S.pax={dblTriple:2,sgl:0,childBed:0,childNoBed:0,infant:0}}
  location.hash=view==='quote'?`#/p/${id}`:(view==='home'?'#/rates':'');
  redraw();
  // Scroll after the view is drawn, or the target section does not exist yet to scroll to.
  if(section){const el=$(section);if(el){el.scrollIntoView({behavior:'smooth'});return}}
  window.scrollTo(0,0);
}
function fromHash(){
  const m=/^#\/p\/(.+)$/.exec(location.hash);
  if(m&&pkgById(decodeURIComponent(m[1])))return['quote',decodeURIComponent(m[1])];
  if(location.hash==='#/rates')return['home',null];
  return['land',null];
}

document.addEventListener('click',e=>{
  const lg=e.target.closest('[data-lang]');
  if(lg){S.lang=lg.dataset.lang;try{localStorage.setItem('lang',S.lang)}catch(_){}return redraw()}
  const jp=e.target.closest('[data-jump]');
  if(jp)return go('home',null,jp.dataset.jump);
  const gt=e.target.closest('[data-goto]');
  if(gt)return go('home',null,gt.dataset.goto);
  if(e.target.closest('#home-link'))return go('land');
  if(e.target.closest('#back'))return go('home');
  if(e.target.closest('#l-cta1')||e.target.closest('#l-cta2')||e.target.closest('#l-band-btn'))
    return go('home',null,'s-pkgs');
  const pk=e.target.closest('[data-pkg]'); if(pk)return go('quote',pk.dataset.pkg);
  const fl=e.target.closest('[data-flt]'); if(fl){S.flightFilter=fl.dataset.flt==='1';return drawHome()}
  const vh=e.target.closest('[data-veh]'); if(vh){S.vehicle=vh.dataset.veh;drawQuote();return render()}
  const tr=e.target.closest('[data-tour]');
  if(tr&&!tr.disabled){const k=tr.dataset.tour;S.tours[k]=!S.tours[k];return render()}
  const vs=e.target.closest('[data-visa]');
  if(vs&&!vs.disabled){const i=vs.dataset.visa;S.visas[i]=(S.visas[i]||0)>0?0:Math.max(1,paxTotal());return render()}
  const pd=e.target.closest('[data-pdec]');
  if(pd){const k=pd.dataset.pdec;S.pax[k]=Math.max(0,S.pax[k]-1);
    S.vehicle=autoVehicle(pkgById(S.pkg));drawQuote();return render()}
  const pi=e.target.closest('[data-pinc]');
  if(pi){const k=pi.dataset.pinc;S.pax[k]=Math.min(40,S.pax[k]+1);
    S.vehicle=autoVehicle(pkgById(S.pkg));drawQuote();return render()}
  const cp=e.target.closest('#cp');
  if(cp){navigator.clipboard.writeText(cp.dataset.txt).then(()=>{
    cp.textContent=t().copied;setTimeout(()=>cp.textContent=t().copy,1600)})}
});
document.addEventListener('input',e=>{if(e.target.closest('.field'))render()});
window.addEventListener('hashchange',()=>{const[v,p]=fromHash();if(v!==S.view||p!==S.pkg)go(v,p)});

try{const s=localStorage.getItem('lang');if(s==='en'||s==='ar')S.lang=s}catch(_){}
(function(){const[v,p]=fromHash();S.view=v;S.pkg=p;redraw()})();
</script>
</body>
</html>
